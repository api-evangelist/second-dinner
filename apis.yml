aid: second-dinner
name: Second Dinner
description: 'Second Dinner is an independent, remote-first video game studio headquartered
  in Irvine, California, founded in 2018 by a group of former Blizzard Hearthstone
  developers including Hamilton Chu, Ben Brode, Yong Woo, Jomaro Kindred and Michael
  Schweitzer. Its debut title, MARVEL SNAP, is a fast-paced digital collectible card
  game built in Unity that won Mobile Game of the Year at both The Game Awards and
  the DICE Awards along with an Apple Design Award, and the studio has since been
  reported to be building its next title on the Godot engine. Second Dinner raised
  a $100M Series B led by Griffin Gaming Partners in January 2024. The studio ships
  consumer games rather than developer platforms: it publishes no public API, SDK,
  developer portal, or machine-readable specification, and its public engineering
  footprint is a small GitHub organization of Unity build and test tooling forks.'
